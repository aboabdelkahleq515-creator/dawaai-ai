services:
  - type: web
    name: dawaai-ai
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_PATH
        value: dawaai.db
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL_TEXT
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_VISION
        value: gemini-3.5-flash-lite
      - key: AI_TIMEOUT_SECONDS
        value: "10.0"
